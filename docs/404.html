<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - TopNotch</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="192x192" href="/top-notch/assets/icon.png">
  <style>
    /* Standalone: a 404 can be served from any path, so no relative assets. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #edebe4;
      color: #141412;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 480px; }
    .label {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #55524a;
    }
    .code {
      font-size: 84px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin: 16px 0 8px;
    }
    .code span { color: #ff4d00; }
    p { color: #55524a; margin-bottom: 32px; }
    a.key-btn {
      display: inline-block;
      background: #141412;
      color: #edebe4;
      text-decoration: none;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 16px 24px;
      border: 1px solid #141412;
      box-shadow: 0 3px 0 0 #141412;
    }
    a.key-btn:active {
      background: #ff4d00;
      border-color: #ff4d00;
      color: #141412;
      transform: translateY(3px);
      box-shadow: none;
    }
    :focus-visible { outline: 2px solid #ff4d00; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="label">TopNotch / error</span>
    <h1 class="code">4<span>0</span>4</h1>
    <p>This page does not exist. Like the camera housing, there is nothing here.</p>
    <a class="key-btn" href="/top-notch/">Back to TopNotch</a>
  </main>
</body>
</html>
